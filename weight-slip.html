
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manual Weight Slip - Sakar Infra</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

.container {
    max-width: 850px;
    margin: auto;
}

.form-panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px #0002;
    margin-bottom: 20px;
}

h2 {
    text-align: center;
    color: #142b4a;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 15px;
}

.net-box {
    background: #e7f5e9;
    padding: 12px;
    border-radius: 5px;
    font-size: 20px;
    font-weight: bold;
    color: #146c32;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
}

button {
    border: 0;
    padding: 12px 20px;
    border-radius: 6px;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.print-btn {
    background: #16834a;
}

.back-btn {
    background: #1769aa;
}

/* FIRST SLIP DESIGN */

.slip {
    background: white;
    border: 2px solid black;
    padding: 18px;
    color: black;
}

.company {
    text-align: center;
    border-bottom: 2px solid black;
    padding-bottom: 10px;
}

.company h1 {
    font-size: 23px;
    margin: 4px 0;
}

.company h3 {
    margin: 5px 0;
    font-size: 17px;
}

.company p {
    margin: 4px 0;
    font-weight: bold;
}

.slip-title {
    text-align: center;
    font-weight: bold;
    font-size: 19px;
    margin: 12px 0;
    text-decoration: underline;
}

.slip-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 15px;
    margin: 12px 0;
}

.slip-info div {
    padding: 7px;
    border-bottom: 1px dotted black;
}

.weight-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

.weight-table th,
.weight-table td {
    border: 1px solid black;
    padding: 12px 8px;
    text-align: center;
    font-size: 16px;
}

.weight-table th {
    background: #eee;
}

.thanks {
    text-align: center;
    font-weight: bold;
    margin-top: 20px;
    font-size: 17px;
}

.signature {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    font-weight: bold;
}

@media (max-width: 600px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}

@page {
    size: A5 landscape;
    margin: 5mm;
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .form-panel,
    .no-print {
        display: none !important;
    }

    .container {
        max-width: none;
        margin: 0;
    }

    .slip {
        width: 100%;
        border: 2px solid black;
        padding: 10px;
    }

    .company h1 {
        font-size: 21px;
    }

    .slip-info {
        font-size: 13px;
    }

    .weight-table th,
    .weight-table td {
        padding: 9px 6px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- INPUT FORM -->

<div class="form-panel">

    <h2>MANUAL WEIGHT SLIP</h2>

    <div class="form-grid">

        <div>
            <label>Vehicle Type</label>

            <select id="vehicleType">
                <option value="">Select Vehicle Type</option>
                <option value="TRUCK">TRUCK</option>
                <option value="TRACTOR">TRACTOR</option>
                <option value="OTHER">OTHER</option>
            </select>
        </div>

        <div>
            <label>Vehicle Number</label>
            <input id="vehicleNo"
            placeholder="RJ 00 XX 0000">
        </div>

        <div>
            <label>Party Name</label>
            <input id="partyName"
            placeholder="Party Name">
        </div>

        <div>
            <label>Mineral</label>
            <input id="mineral"
            placeholder="Mineral Name">
        </div>

        <div>
            <label>Gross Weight (KG)</label>

            <input type="number"
            id="gross"
            min="0"
            step="any"
            placeholder="Gross Weight"
            oninput="calculateNet()">
        </div>

        <div>
            <label>Tare Weight (KG)</label>

            <input type="number"
            id="tare"
            min="0"
            step="any"
            placeholder="Tare Weight"
            oninput="calculateNet()">
        </div>

        <div>
            <label>Net Weight (KG)</label>
            <div class="net-box" id="net">0 KG</div>
        </div>

        <div>
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div>
            <label>Time</label>
            <input type="time" id="time">
        </div>

    </div>

    <div class="actions">

        <button class="print-btn" onclick="printSlip()">
            🖨️ PRINT SLIP
        </button>

        <button class="back-btn" onclick="goDashboard()">
            ← BACK TO DASHBOARD
        </button>

    </div>

</div>

<!-- FIRST PRINT SLIP -->

<div class="slip" id="printArea">

    <div class="company">
        <h1>SAKAR INFRA MINERALS PRIVATE LIMITED</h1>
        <h3>DHINDHOL, JAIPUR</h3>
        <p>RAJASTHAN</p>
    </div>

    <div class="slip-title">
        WEIGHT SLIP
    </div>

    <div class="slip-info">

        <div>
            <b>Vehicle Type:</b>
            <span id="pVehicleType">-</span>
        </div>

        <div>
            <b>Vehicle No.:</b>
            <span id="pVehicleNo">-</span>
        </div>

        <div>
            <b>Party Name:</b>
            <span id="pParty">-</span>
        </div>

        <div>
            <b>Mineral:</b>
            <span id="pMineral">-</span>
        </div>

        <div>
            <b>Date:</b>
            <span id="pDate">-</span>
        </div>

        <div>
            <b>Time:</b>
            <span id="pTime">-</span>
        </div>

    </div>

    <table class="weight-table">

        <thead>
            <tr>
                <th>GROSS WEIGHT</th>
                <th>TARE WEIGHT</th>
                <th>NET WEIGHT</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td id="pGross">0 KG</td>
                <td id="pTare">0 KG</td>
                <td id="pNet">0 KG</td>
            </tr>
        </tbody>

    </table>

    <div class="thanks">
        THANKS FOR VISIT
    </div>

    <div class="signature">
        <span>Operator Sign</span>
        <span>Authorized Sign</span>
    </div>

</div>

</div>

<script>

/* LOGIN CHECK */

if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "index.html";
}

/* DEFAULT DATE AND TIME */

const today = new Date();

document.getElementById("date").value =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");

document.getElementById("time").value =
    String(today.getHours()).padStart(2, "0") + ":" +
    String(today.getMinutes()).padStart(2, "0");

/* CALCULATE NET WEIGHT */

function calculateNet() {

    const gross =
        parseFloat(document.getElementById("gross").value) || 0;

    const tare =
        parseFloat(document.getElementById("tare").value) || 0;

    const net = gross - tare;

    document.getElementById("net").textContent =
        net.toLocaleString("en-IN") + " KG";

}

/* GET FORM DATA */

function getSlipData() {

    const grossValue = document.getElementById("gross").value;
    const tareValue = document.getElementById("tare").value;

    const gross = parseFloat(grossValue);
    const tare = parseFloat(tareValue);

    return {

        vehicleType:
            document.getElementById("vehicleType").value,

        vehicleNo:
            document.getElementById("vehicleNo").value.trim(),

        partyName:
            document.getElementById("partyName").value.trim(),

        mineral:
            document.getElementById("mineral").value.trim(),

        gross: gross,
        tare: tare,
        net: gross - tare,

        date:
            document.getElementById("date").value,

        time:
            document.getElementById("time").value

    };

}

/* SAVE DATA FOR SECOND SLIP */

function saveSecondSlipData() {

    const data = getSlipData();

    localStorage.setItem(
        "sakarSecondSlip",
        JSON.stringify(data)
    );

}

/* UPDATE FIRST SLIP */

function updateSlip() {

    const data = getSlipData();

    const fields = [
        ["pVehicleType", data.vehicleType],
        ["pVehicleNo", data.vehicleNo],
        ["pParty", data.partyName],
        ["pMineral", data.mineral],
        ["pDate", data.date],
        ["pTime", data.time]
    ];

    fields.forEach(function(pair) {

        document.getElementById(pair[0]).textContent =
            pair[1] || "-";

    });

    document.getElementById("pGross").textContent =
        data.gross.toLocaleString("en-IN") + " KG";

    document.getElementById("pTare").textContent =
        data.tare.toLocaleString("en-IN") + " KG";

    document.getElementById("pNet").textContent =
        data.net.toLocaleString("en-IN") + " KG";

}

/* AUTO SAVE WHEN FORM CHANGES */

const formFields = [
    "vehicleType",
    "vehicleNo",
    "partyName",
    "mineral",
    "gross",
    "tare",
    "date",
    "time"
];

formFields.forEach(function(id) {

    const field = document.getElementById(id);

    field.addEventListener("input", saveSecondSlipData);
    field.addEventListener("change", saveSecondSlipData);

});

/* PRINT FIRST SLIP */

function printSlip() {

    const data = getSlipData();

    if (!data.vehicleType) {
        alert("कृपया Vehicle Type Select करें।");
        return;
    }

    if (!data.vehicleNo) {
        alert("कृपया Vehicle Number भरें।");
        return;
    }

    if (!document.getElementById("gross").value ||
        !document.getElementById("tare").value) {

        alert("कृपया Gross और Tare Weight भरें।");
        return;
    }

    if (!Number.isFinite(data.gross) ||
        !Number.isFinite(data.tare) ||
        data.gross < 0 ||
        data.tare < 0) {

        alert("कृपया सही Weight भरें।");
        return;
    }

    if (data.gross < data.tare) {
        alert("Gross Weight, Tare Weight से कम नहीं हो सकता।");
        return;
    }

    updateSlip();

    /* SAVE BEFORE PRINTING */

    try {

        saveSecondSlipData();

        if (!localStorage.getItem("sakarSecondSlip")) {
            alert("Second Slip Data Save Nahi Hua");
            return;
        }

    } catch(error) {

        alert("Data Save Error: " + error.message);
        return;

    }

    window.print();

}

/* BACK TO DASHBOARD */

function goDashboard() {

    saveSecondSlipData();

    window.location.href = "dashboard.html";

}

/* INITIAL SETUP */

calculateNet();
updateSlip();

</script>

</body>
</html>

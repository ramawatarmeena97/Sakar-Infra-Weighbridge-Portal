<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sakar Infra Weighbridge Portal - Login</title>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0083ff, #00ffa6);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
}

.box {
  background: #ffffffee;
  padding: 40px 30px;
  border-radius: 20px;
  width: 350px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s, box-shadow 0.3s;
}

.box:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.box h2 {
  margin-bottom: 5px;
  color: #013369;
}

.box h4 {
  margin-bottom: 25px;
  color: #555;
  font-weight: normal;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

input:focus {
  border: 1px solid #0083ff;
  box-shadow: 0 0 8px rgba(0, 131, 255, 0.4);
  outline: none;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(45deg, #0083ff, #00ffa6);
  color: white;
  transition: background 0.3s, transform 0.2s;
  margin-top: 10px;
}

button:hover {
  background: linear-gradient(45deg, #00ffa6, #0083ff);
  transform: translateY(-3px);
}

.box p {
  margin-top: 20px;
  font-size: 14px;
  color: #888;
}
.toggle-link {
  color: #1e88e5;
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="box">
  <h2 id="form-title">Login</h2>
  <h4>Sakar Infra Weighbridge Portal</h4>

  <input id="user" placeholder="Enter Username" />
  <input id="pass" type="password" placeholder="Enter Password" />

  <button id="actionBtn" onclick="login()">Login</button>

  <p class="toggle-text">
    Don't have an account? <span class="toggle-link" id="signupLink" onclick="switchToSignup()">Sign Up</span>
    <span class="toggle-link" id="backToLoginLink" style="display:none;" onclick="switchToLogin()">Back to Login</span>
  </p>
  <p>&copy; 2026 Sakar Infra</p>
</div>

<script>
function generateCaptcha() {
  return Math.floor(100000 + Math.random() * 900000);
}

let captchaCode = generateCaptcha();

function switchToSignup() {
  document.getElementById("form-title").innerText = "Sign Up";
  document.getElementById("actionBtn").innerText = "Register";

  document.getElementById("signupLink").style.display = "none";
  document.getElementById("backToLoginLink").style.display = "inline";

  document.getElementById("user").value = "";
  document.getElementById("pass").value = "";
  document.getElementById("user").placeholder = "Enter New Username";
  document.getElementById("pass").placeholder = "Enter Password";

  document.getElementById("actionBtn").onclick = register;
}

function switchToLogin() {
  document.getElementById("form-title").innerText = "Login";
  document.getElementById("actionBtn").innerText = "Login";

  document.getElementById("signupLink").style.display = "inline";
  document.getElementById("backToLoginLink").style.display = "none";

  document.getElementById("user").value = "";
  document.getElementById("pass").value = "";
  document.getElementById("user").placeholder = "Enter Username";
  document.getElementById("pass").placeholder = "Enter Password";

  document.getElementById("actionBtn").onclick = login;
}

// Login function
function login() {
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value.trim();

  if (username === "" || password === "") {
    alert("Username and Password are required");
    return;
  }

  const users = JSON.parse(localStorage.getItem("users")) || {};

  if (users[username] && users[username].password === password) {
    alert("Login Successful (Demo)");
    localStorage.setItem("loggedIn", "true");
    // Redirect to dashboard or another page if needed
    // window.location.href = "dashboard.html";
  } else {
    alert("Wrong Username or Password");
  }
}

// Register function
function register() {
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value.trim();

  if (username === "" || password === "") {
    alert("Enter username and password");
    return;
  }

  const users = JSON.parse(localStorage.getItem("users")) || {};

  if (users[username]) {
    alert("Username already exists");
    return;
  }

  users[username] = { password: password };
  localStorage.setItem("users", JSON.stringify(users));
  alert("Registration successful! Please login.");
  switchToLogin();
}

// On load, check if logged in
window.onload = function() {
  if (localStorage.getItem("loggedIn") === "true") {
    // Already logged in, redirect if needed
    // window.location.href = "dashboard.html";
    alert("Already logged in");
  }
  // Initialize form
  switchToLogin();
};
</script>

</body>
</html>

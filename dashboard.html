
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sakar Infra Weighbridge Portal - Dashboard</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Segoe UI;
}

body {
    min-height:100vh;
    background:linear-gradient(135deg,#007bff,#00ffa6);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:30px;
    color:#222;
}

.wrapper {
    max-width:1100px;
    width:100%;
}

.header {
    text-align:center;
    margin-bottom:20px;
    color:white;
    position:relative;
}

.logout-btn {
    position:absolute;
    top:0;
    right:0;
    padding:8px 15px;
    background:#e74c3c;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.logout-btn:hover {
    background:#c0392b;
}

.card {
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    margin-bottom:25px;
}

button {
    padding:12px 22px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin:5px;
    transition:0.2s;
}

button:hover {
    opacity:0.85;
    transform:translateY(-2px);
}

.blue {background:#007bff;color:white;}
.red {background:#ff3b3b;color:white;}
.green {background:#00c853;color:white;}
.gray {background:#444;color:white;}

.slip-panel {
    text-align:center;
}

.slip-panel button {
    min-width:240px;
    padding:16px 25px;
    font-size:17px;
    font-weight:bold;
}

.footer {
    text-align:center;
    color:white;
    margin-top:15px;
}

@media(max-width:600px) {
    body {
        padding:12px;
    }

    .header h1 {
        font-size:22px;
        padding-top:40px;
    }

    button {
        width:100%;
        margin:6px 0;
    }

    .logout-btn {
        width:auto;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- HEADER -->
<div class="header">

    <h1>🚚 Sakar Infra Weighbridge Portal 🚧</h1>
    <p>Dashboard</p>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</div>

<!-- AUDIO CONTROL PANEL -->
<div class="card">

    <h2>🔊 Audio Control Panel</h2>

    <br>

    <button class="green" onclick="playAudio('vajan_sahi')">
        Vajan Sahi Hai
    </button>

    <button class="red" onclick="playAudio('galat')">
        Vajan Galat Hai
    </button>

    <button class="blue" onclick="playAudio('site_band')">
        Site Nahi Chal Rahi – Gaadi Piche Karein
    </button>

    <br>

    <button class="gray" onclick="pauseAudio()">
        ⏸ Pause
    </button>

    <button class="red" onclick="stopAudio()">
        ⛔ Stop
    </button>

    <button class="green" onclick="playAudio('gadi_aage')">
        🚛 Gaadi Aage Lao
    </button>

    <button class="blue" onclick="playAudio('gadi_piche')">
        🚛 Gaadi Piche Lao
    </button>

    <br><br>

    <p>
        <b>Keyboard Shortcuts:</b>
        1 = Sahi • 2 = Galat • 3 = Site Band • 0 = Stop
    </p>

</div>

<!-- WEIGHT SLIP BUTTON PANEL -->
<div class="card slip-panel">

    <h2>📄 Weight Slip Management</h2>

    <p style="margin:15px 0;">
        Select the page you want to open
    </p>

    <button class="blue"
    onclick="window.location.href='weight-slip.html'">

        ⚖ WEIGHT SLIP

    </button>

 <button class="green"
onclick="window.location.href='second-slip.html'">

        📋 SECOND SLIP

    </button>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Sakar Infra | All Rights Reserved
</div>

</div>

<!-- AUDIO FILES -->
<audio id="vajan_sahi" src="vajan_sahi_age.mp3.mpeg"></audio>

<audio id="galat" src="galat.mp3.mp3"></audio>

<audio id="site_band" src="site_nahi_chal_rhi.mp3"></audio>

<audio id="gadi_aage" src="forward.wav"></audio>

<audio id="gadi_piche" src="backward.wav"></audio>

<script>

/* LOGIN CHECK */
if(!localStorage.getItem("loggedIn")) {
    window.location.href="index.html";
}

/* LOGOUT */
function logout() {

    localStorage.removeItem("loggedIn");

    window.location.href="index.html";
}

/* AUDIO CONTROL */
let currentAudio = null;

function playAudio(id) {

    if(currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    currentAudio = document.getElementById(id);

    currentAudio.play().catch(error => {
        console.log("Audio playback error:", error);
    });
}

function pauseAudio() {

    if(currentAudio) {
        currentAudio.pause();
    }

}

function stopAudio() {

    if(currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

}

/* KEYBOARD SHORTCUTS */
document.addEventListener("keydown",function(e) {

    if(e.key === "1") playAudio("vajan_sahi");

    if(e.key === "2") playAudio("galat");

    if(e.key === "3") playAudio("site_band");

    if(e.key === "0") stopAudio();

});

</script>

</body>
</html>
